<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoToS Cortex — Chambre immersive</title><style>
:root{color-scheme:dark;--blue:#39bfff;--gold:#f5c76b;--bg:#050913}*{box-sizing:border-box}body{margin:0;background:#030711;color:#eaf6ff;font:14px 'Segoe UI',system-ui,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 36%,#02040c99 100%)}header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;background:linear-gradient(#020712ef,transparent);pointer-events:none}header>*{pointer-events:auto}.brand{font-weight:900;letter-spacing:.18em;font-size:19px;text-shadow:0 0 20px #23bfff88}.brand em{font-style:normal;color:var(--gold)}.tag{font-size:10px;letter-spacing:.25em;color:#81b7ce;margin-top:5px}.status{border:1px solid #4e89a055;background:#081727a8;border-radius:99px;padding:10px 15px;color:#b8e9fa}.dot{display:inline-block;width:7px;height:7px;background:#50e4ba;border-radius:50%;box-shadow:0 0 10px #50e4ba;margin-right:8px}.sidebar{position:absolute;left:24px;top:30%;width:190px;display:grid;gap:10px}.panel{background:linear-gradient(115deg,#091a2be8,#07101bdc);border:1px solid #2c77957d;box-shadow:0 8px 40px #0008,inset 0 1px #ffffff0e;backdrop-filter:blur(12px);border-radius:14px;padding:13px}.small{color:#7ea7c0;letter-spacing:.16em;font-size:10px;font-weight:700;margin:0 0 12px}.nav{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;text-align:left;padding:11px 9px;color:#c5e3ef;cursor:pointer;font:inherit;transition:.2s}.nav:hover,.nav.active{background:#12314a;border-color:#3486ac;color:white;transform:translateX(3px)}.nav span{color:var(--gold);margin-right:10px}.right{position:absolute;right:24px;top:30%;width:225px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #2b587055;padding:11px 0;color:#b2d2e2}.metric strong{color:var(--gold)}.right button,.action{cursor:pointer;background:linear-gradient(120deg,#166b9e,#1c3d69);border:1px solid #57bdf3;color:#fff;border-radius:10px;padding:12px;font:inherit;font-weight:700;box-shadow:0 0 24px #009eff22}.right button{width:100%;margin-top:15px}.bottom{position:absolute;bottom:23px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;max-width:calc(100% - 30px)}.action{white-space:nowrap}.action:hover,.right button:hover{filter:brightness(1.3)}.action.secondary{background:#081b2bd9;border-color:#3b7a97}.hint{position:absolute;bottom:25px;left:24px;font-size:11px;color:#8cb4c9;max-width:240px}.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(490px,calc(100vw - 30px));padding:24px;background:#071422f5;border:1px solid #49aee8;border-radius:20px;box-shadow:0 20px 100px #000,0 0 50px #1d9deb44;display:none}.modal.show{display:block}.modal h2{margin:0 0 12px;color:#e8f8ff}.modal p{color:#b4d4e4;line-height:1.7}.modal textarea{width:100%;height:90px;background:#07111c;color:white;border:1px solid #3c819f;border-radius:10px;padding:10px;resize:vertical;font:inherit}.modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);border:1px solid #428eb0;background:#071726e9;padding:12px 20px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}.toast.visible{opacity:1}@media(max-width:780px){header{padding:12px}.sidebar{left:8px;top:90px;width:155px}.right{right:8px;top:90px;width:150px}.panel{padding:9px}.nav{padding:8px 4px;font-size:12px}.bottom{bottom:10px}.hint{display:none}.status{font-size:10px;padding:7px}.brand{font-size:15px}.right .metric{font-size:11px}.action{padding:9px;font-size:11px}}
</style></head><body><canvas id="scene" aria-label="Chambre gaming PoToS interactive"></canvas><div class="veil"></div><header><div><div class="brand">♛ PoToS <em>CORTEX</em></div><div class="tag">CHAMBRE IMMERSIVE · PROTOTYPE 01</div></div><div class="status"><span class="dot"></span>CHAMBRE LOCALE · DÉMO</div></header><aside class="sidebar panel"><p class="small">EXPLORER</p><button class="nav active" data-room="accueil"><span>◈</span> Accueil</button><button class="nav" data-room="cs2"><span>⌖</span> Espace CS2</button><button class="nav" data-room="communaute"><span>♧</span> Communauté</button><button class="nav" data-room="atelier"><span>✧</span> Atelier</button><button class="nav" data-room="reunion"><span>♜</span> Réunion privée</button><button class="nav" data-room="jukebox"><span>♫</span> Jukebox</button></aside><aside class="right panel"><p class="small">TABLEAU DE BORD</p><div class="metric">Compagnon <strong>PoToS</strong></div><div class="metric">Rendu <strong>Temps réel</strong></div><div class="metric">IA <strong>Non reliée</strong></div><div class="metric">Discord <strong>Démo locale</strong></div><button id="hello">✦ Saluer PoToS</button></aside><div class="hint">Déplacer la souris pour explorer · Glisser pour tourner · Cliquer sur PoToS pour interagir</div><div class="bottom"><button class="action" id="talk">◉ Parler à PoToS</button><button class="action secondary" id="tour">⟳ Changer la vue</button><button class="action secondary" id="help">? Aide</button></div><div id="toast" class="toast" role="status"></div><section id="modal" class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><p id="modalText"></p><textarea id="message" placeholder="Écris ici ton idée ou ta question…" style="display:none"></textarea><footer><button class="action secondary" id="close">Fermer</button><button class="action" id="submit" style="display:none">Envoyer</button></footer></section>
<script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),toast=document.querySelector('#toast'),modal=document.querySelector('#modal');let W=0,H=0,DPR=1,t=0,pan=0,targetPan=0,mouseX=0,mouseY=0,drag=false,dragX=0,room='accueil',wave=0;const pi=Math.PI;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function poly(pts,fill,stroke,width=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}function line(a,b,color,w=1){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}function rect(x,y,w,h,fill,stroke,r=0){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function glow(x,y,r,c){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}function text(s,x,y,size=13,color='#e6f8ff',align='center',weight=600){ctx.font=`${weight} ${size}px Segoe UI,Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y)}function draw(){t+=.016;pan+=(targetPan-pan)*.055;let cx=W/2+pan*W*.11,cy=H*.52+Math.sin(mouseY)*3,sc=Math.min(W/1250,H/750)*1.06;sc=Math.max(.53,sc);ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#040916');bg.addColorStop(1,'#08162a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
// Room perspective, back wall, ceiling and floor
poly([[-600,-350],[600,-350],[460,-215],[-460,-215]],'#070f20','#173e5d');poly([[-600,-350],[-460,-215],[-460,245],[-600,380]],'#07172b','#225274');poly([[600,-350],[460,-215],[460,245],[600,380]],'#061426','#235477');poly([[-460,-215],[460,-215],[460,245],[-460,245]],'#0b1c33','#234c6c');poly([[-600,380],[600,380],[460,245],[-460,245]],'#091422','#1a5678');for(let i=0;i<14;i++){let x=-580+i*90;line([x,380],[x*.76,245],'#164365',1)}for(let i=0;i<8;i++){let y=245+i*i*2.7;line([-600,y],[600,y],'#103b58',1)}line([-460,-213],[460,-213],'#4bd4ff',3);line([-460,244],[460,244],'#39aef0',2);line([-580,360],[-470,250],'#e8b953',2);line([580,360],[470,250],'#e8b953',2);glow(0,-190,310,'#0b8cfb22');
// Wall panels and gaming screens
rect(-406,-172,218,260,'#06111e','#27749c',12);rect(-395,-160,196,237,'#081a2a','#1b567d',7);for(let j=0;j<8;j++)line([-385,-140+j*27],[-211,-140+j*27],'#114466',1);text('PoToS',-295,-88,29,'#59cfff');text('CS2 COMMUNITY',-295,-52,12,'#d4b77e');rect(-365,-14,140,65,'#082943','#2289c3',7);text('SERVEURS',-295,10,13,'#a2ddf4');text('●  ●  ●',-295,35,18,'#4bd9ad');rect(192,-172,215,260,'#07131e','#287ba6',12);rect(203,-160,193,237,'#081b2b','#1b587b',7);text('CORTEX',299,-112,23,'#64d9ff');text('ACTIVITÉS',299,-88,11,'#b9a36b');for(let j=0;j<4;j++){rect(221,-57+j*44,158,32,'#0c2b42','#256486',5);text(['◈  ESPACE CS2','✦  CRÉATION','♜  RÉUNIONS','♫  JUKEBOX'][j],300,-37+j*44,12,'#c4ecff')}
// Central emblem
ctx.save();ctx.shadowBlur=27;ctx.shadowColor='#1dafff';ctx.beginPath();ctx.arc(0,-139,63,0,pi*2);ctx.strokeStyle='#3baae4';ctx.lineWidth=2;ctx.stroke();ctx.restore();text('♛',0,-147,41,'#f5c76b');text('P O T O S',0,-111,13,'#80d9ff');
// Desks on sides
poly([[-550,175],[-320,175],[-280,210],[-560,220]],'#10253a','#2a799d',2);poly([[320,175],[550,175],[560,220],[280,210]],'#10253a','#2a799d',2);rect(-515,55,165,111,'#030912','#3486a9',6);rect(-503,66,141,86,'#082b4b','#45bfff',4);text('PoToS #CS2',-432,111,15,'#9fe5ff');rect(350,55,165,111,'#030912','#3486a9',6);rect(362,66,141,86,'#092d4d','#45bfff',4);text('IMAGINATION',432,111,14,'#9fe5ff');glow(-432,126,110,'#138bd62c');glow(432,126,110,'#138bd62c');
// Platform
ctx.beginPath();ctx.ellipse(0,248,185,45,0,0,pi*2);ctx.fillStyle='#091c30';ctx.fill();ctx.strokeStyle='#30bfff';ctx.lineWidth=4;ctx.stroke();glow(0,235,180,'#168dfb38');
// Robot articulated, lively and distinctly robotic
let bob=Math.sin(t*1.7)*4,blink=(Math.sin(t*.73)> .997)?1:0;ctx.save();ctx.translate(0,12+bob);ctx.shadowColor='#24baff';ctx.shadowBlur=12;poly([[-58,120],[-78,186],[-39,191],[-20,138]],'#0b1828','#3c9dcc',2);poly([[58,120],[78,186],[39,191],[20,138]],'#0b1828','#3c9dcc',2);rect(-49,175,49,24,'#091526','#4ab4e5',7);rect(0,175,49,24,'#091526','#4ab4e5',7);poly([[-74,-7],[-51,110],[51,110],[74,-7],[38,-34],[-38,-34]],'#0d1c30','#43b5ed',3);poly([[-49,0],[49,0],[34,77],[-34,77]],'#071322','#2b6d9e',2);rect(-30,18,60,42,'#0b2d4c','#319bd1',7);text('PoToS',0,45,17,'#8de9ff');poly([[-69,-15],[-109,10],[-95,83],[-74,73],[-55,6]],'#0c1d32','#3aa9d9',3);poly([[69,-15],[109,10],[95,83],[74,73],[55,6]],'#0c1d32','#3aa9d9',3);let arm=Math.sin(t*3)*8+wave;poly([[91,73],[104+arm,80],[100+arm,126],[82,125]],'#0b1a2d','#40b1e8',2);poly([[-91,73],[-104,80],[-100,126],[-82,125]],'#0b1a2d','#40b1e8',2);glow(0,38,65,'#15a4f94b');ctx.shadowBlur=18;rect(-70,-135,140,122,'#0a1a2c','#42baff',27);rect(-56,-115,112,71,'#03101d','#2276ab',17);rect(-44,-93,33,blink?3:15,'#55dfff',null,7);rect(11,-93,33,blink?3:15,'#55dfff',null,7);glow(-27,-86,31,'#2bbfff40');glow(27,-86,31,'#2bbfff40');rect(-22,-48,44,7,'#2e9ecf',null,3);rect(-85,-105,20,56,'#102c44','#53c7f5',8);rect(65,-105,20,56,'#102c44','#53c7f5',8);ctx.shadowBlur=0;poly([[-44,-143],[-35,-183],[-11,-158],[0,-196],[12,-158],[37,-183],[44,-143]],'#b99446','#ffe29a',2);glow(0,-175,75,'#f2b74728');ctx.restore();ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
function notice(s){toast.textContent=s;toast.classList.add('visible');clearTimeout(notice.timer);notice.timer=setTimeout(()=>toast.classList.remove('visible'),3500)}function dialog(title,desc,compose=false){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=desc;document.querySelector('#message').style.display=compose?'block':'none';document.querySelector('#submit').style.display=compose?'block':'none';modal.classList.add('show')}document.querySelector('#close').onclick=()=>modal.classList.remove('show');document.querySelector('#submit').onclick=()=>{let v=document.querySelector('#message').value.trim();if(!v)return notice('Écris un message avant de continuer.');modal.classList.remove('show');notice('Message local reçu. Connexion à Cortex à développer : aucune donnée envoyée.');document.querySelector('#message').value=''};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-room]').forEach(x=>x.classList.remove('active'));b.classList.add('active');room=b.dataset.room;const data={accueil:['Bienvenue dans la chambre','La chambre PoToS est interactive : explore les menus, salue le robot et change de vue.'],cs2:['Espace CS2','Futur panneau : état des serveurs PoToS, communauté, événements et statistiques. Les données réelles ne sont pas encore connectées.'],communaute:['Communauté PoToS','Futur panneau : membres, annonces, animations et activités partagées.'],atelier:['Atelier Imagination','Futur espace de création : idées, dessins, code et projets communautaires.'],reunion:['Réunion privée','Espace prévu pour les réunions à consentement explicite, transcription et validation humaine. Aucune écoute active dans cette démo.'],jukebox:['Jukebox','Futur lecteur de musiques autorisées. Aucune musique n’est diffusée par cette démo.']};dialog(...data[room])});document.querySelector('#hello').onclick=()=>{wave=12;notice('PoToS : « Je t’écoute ! Que souhaites-tu faire ? »');setTimeout(()=>wave=0,1400)};document.querySelector('#talk').onclick=()=>dialog('Parler à PoToS','Mode démonstration : écris une phrase pour tester l’interface. Le véritable moteur Cortex n’est pas encore connecté.',true);document.querySelector('#tour').onclick=()=>{targetPan=targetPan>.5?-1:targetPan<-.5?0:1;notice('Caméra : vue modifiée')};document.querySelector('#help').onclick=()=>dialog('Commandes de la chambre','Utilise les menus de gauche, clique sur le robot pour le saluer, ou fais glisser la scène pour changer l’angle. Cette version est un prototype visuel local : pas encore une activité Discord publiée.');canvas.addEventListener('pointerdown',e=>{drag=true;dragX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-dragX)<9&&Math.abs(e.clientX-W/2)<110&&e.clientY>H*.36&&e.clientY<H*.86){wave=15;notice('PoToS te salue !');setTimeout(()=>wave=0,1200)}drag=false});canvas.addEventListener('pointermove',e=>{mouseX=e.clientX/W;mouseY=e.clientY/H;if(drag)targetPan=Math.max(-1.3,Math.min(1.3,targetPan+(e.movementX||0)/W*3))});addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});})();
</script></body></html>
